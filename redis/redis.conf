# Persistence
dir /data
appendonly yes
appendfsync everysec

# Network
# Bind to all interfaces, as this is running in a Docker container
bind 0.0.0.0
protected-mode no
port 6379

# Memory
# Set a reasonable memory limit
maxmemory 512mb
maxmemory-policy allkeys-lru

# Performance
timeout 0
tcp-keepalive 300
loglevel notice