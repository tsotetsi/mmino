user  nginx;
worker_processes  auto; # Scales to available CPU cores
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Performance Tuning ---
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off; # Hides Nginx version

    # --- Gzip Compression ---
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # --- Upstream Definitions ---
    upstream api_server {
        server api:8000;
    }

    # --- 1. HTTP Server (Redirect to HTTPS & Let's Encrypt Challenge) ---
    server {
        listen 80;
        listen [::]:80;
        server_name mmino.com;

        # Necessary for Let's Encrypt certificate renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- 2. HTTPS Server (Production API & Security) ---
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on; 
        server_name example.com; # <--- REPLACE ME

        # SSL Certificates (Managed by Certbot)
        ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem; # <--- REPLACE ME
        ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem; # <--- REPLACE ME

        # Hardened SSL Security (Files generated by init-ssl.sh)
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # File upload size limit
        client_max_body_size 500M;

        # Timeouts for large processing tasks
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # API Reverse Proxy
        location / {
            proxy_pass http://api_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Buffering for large uploads
            proxy_request_buffering off; 
        }

        # Celery Flower Proxy (Subpath handling)
        location /flower/ {
            auth_basic "Restricted Access";
            auth_basic_user_file /etc/nginx/.htpasswd;            

            # Ensure trailing slash redirects work correctly
            rewrite ^/flower/(.*)$ /$1 break;
            proxy_pass http://flower:5555;
            proxy_set_header Host $host;
            proxy_redirect off;
            
            # Required for Flower WebSockets
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Static files for downloads
        location /downloads/ {
            alias /shared_data/downloads/;
            expires 1d;
            add_header Cache-Control "public, no-transform";
            autoindex off; # Disable directory listing for security
        }

        # Internal Health Check
        location /health {
            access_log off;
            return 200 'OK';
        }
    }
}